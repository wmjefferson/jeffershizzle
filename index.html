<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="jeffershizzle dotcom - a photography spiderweb by Jefferson">
    <title>jeffershizzle dotcom.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <!-- Site icon files: swap favicon.svg here if you want a different tab/bookmark icon. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <!-- Bookmark/share preview image: keep bookmark-preview.png beside this file if you want richer browser/share previews. -->
    <meta property="og:image" content="https://www.jeffershizzle.com/bookmark-preview.png">
    <meta name="twitter:image" content="https://www.jeffershizzle.com/bookmark-preview.png">
</head>
<body>

    <!-- Top Banner - 36px, white bottom border -->
    <header id="site-header" class="banner">
        <a href="#/" id="site-title"><h3>jeffershizzle dotcom.</h3></a>
        <nav id="site-nav">
            <a href="#/browse"><h3>browse.</h3></a>
        </nav>
    </header>

    <!-- Content area between banners -->
    <div id="gallery-container">
        <div id="gallery-content"></div>
    </div>

    <!-- Instructions overlay -->
    <div id="instructions" class="hidden">
        <p id="instructions-text"></p>
    </div>

    <!-- Bottom Banner - 36px, white top border -->
    <footer id="site-footer" class="banner">
        <a href="#/" id="footer-back"><h3>index.</h3></a>
        <span id="footer-category"></span>
    </footer>

    <!-- Loading indicator -->
    <div id="loader" class="hidden">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
